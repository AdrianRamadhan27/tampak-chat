[project]
name = "tampak-chat-backend"
version = "0.1.0"
description = "Inspectable document retrieval and analytics conversations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.8",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.28",
  "cryptography>=44",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "duckdb>=1.2",
  "pyarrow>=19",
  "pdfplumber>=0.11",
  "pypdf>=5",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=11",
  "pytesseract>=0.3.13",
  "reportlab>=4.3",
  "tiktoken>=0.9",
  "charset-normalizer>=3.4",
  "ragas==0.4.3",
  "langchain-community==0.3.31",
]

[project.optional-dependencies]
processing = ["docling>=2.70", "torch>=2.2", "torchvision>=0.17"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "respx>=0.22"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI intentionally uses dependency/form declarations as defaults.


# Linux containers run OCR/layout on CPU; avoid downloading CUDA runtimes.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
